<style>

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(26px,6vw,52px);border-radius:8px}

.row,.rec,.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
button{font:inherit;font-weight:600;background:#fff7d6;color:#17100a;border:3px solid #17100a;border-radius:12px;padding:6px 16px;cursor:pointer;font-size:20px}
button:disabled{opacity:.4}button:focus-visible{outline:3px solid #ffd84a}
.ing{padding:6px 10px;font-size:26px;line-height:1.1}.ing small{display:block;font-size:13px}.ing.on{background:#ffd84a}
.ch{background:#fff7d6;color:#17100a;border:3px solid #17100a;border-radius:10px;padding:4px 12px;font-size:22px;font-weight:600}
.sm{filter:blur(1.5px);opacity:.7;background:#b9b3a0}
.bar{position:relative;width:min(560px,90%);height:34px;background:#000;border:3px solid #fff7d6;border-radius:10px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}.zn{background:#4cc95a}.mk{width:6px;background:#fff;margin-left:-3px}
.po{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid #17100a;vertical-align:middle;margin-right:6px}
svg.d1{--gn:.14}svg.d2{--gn:.2}svg.d3{--gn:.3}svg.d4{--gn:.4}.idle{animation:id 3.5s ease-in-out infinite}@keyframes id{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=id=>document.getElementById(id),ui=$('ui'),sv=$('sv'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CUOTA=8,PAGA={g:[5,1],h:[9,2]};
let day=1,coins=0,rot=0,col=null;
const ING=[['Moho','🍄','#9c5fd1'],['Raíz','🥕','#ff9a3c'],['Sal','🧂','#e8e8f0'],['Hueso','🦴','#e8dcc0'],['Ojo','👁️','#6fd0ff'],['Flor','🌹','#ff4f7a'],['Araña','🕷️','#555566'],['Cera','🕯️','#ffe08a']];
const emo=n=>ING.find(i=>i[0]==n)[1];
const D=[
{m:'Alguien pasó por acá.',g:['Algo para dormir. Nada más.',['Flor','Moho','Sal']],h:['Algo para que pase.',['Raíz','Moho','Sal']],a:'Gracias.',r:'Entonces vuelvo mañana.',d:'Ocho. Todas las noches.'},
{m:'Frascos vacíos tirados en la tierra. “No son tuyos. ¿O sí?”',g:['Para los huesos. Me duelen cuando llueve.',['Hueso','Raíz','Sal']],h:['Lo mismo, pero más fuerte.',['Hueso','Ojo','Moho']],a:'Ayer ayudó.',r:'Ayer ayudó.',d:'Estás cumpliendo.'},
{m:'Una luz lejana que no se apaga.',g:['Para ver en la oscuridad.',['Ojo','Cera','Araña']],h:['No me preguntes para qué.',['Araña','Raíz','Cera']],a:'La mano tiembla al agarrar el frasco.',r:'La mano golpea la ventanilla. Una vez. Suave.',d:'Todos pagan.'},
{m:'Hoy no hay nada.',g:['Algo para el miedo.',['Flor','Sal','Cera']],h:['La última. Después no vengo más.',['Ojo','Hueso','Flor']],a:'La mano se queda un segundo de más. Después se retira.',r:'La mano se queda un segundo de más. Después se retira.',d:'Última noche. Veamos qué elegiste.'}];
/* audio */
let A,mg,bg,wg,sg;
function tone(f,d,o,t='sine',v=.2,f2){if(!A)return;const x=A.createOscillator(),g=A.createGain(),n=A.currentTime;x.type=t;x.frequency.setValueAtTime(f,n);if(f2)x.frequency.linearRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);x.connect(g);g.connect(o);x.start();x.stop(n+d);}
function audio(){if(A)return;A=new AudioContext();[mg,bg,wg,sg]=[0,0,0,0].map(()=>{const g=A.createGain();g.gain.value=0;g.connect(A.destination);return g});sg.gain.value=1;
const b=A.createBuffer(1,A.sampleRate*2,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const s=A.createBufferSource(),f=A.createBiquadFilter();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=380;s.connect(f);f.connect(wg);s.start();
const sc=[261,293,329,392,440,392,329,293];let k=0;
setInterval(()=>{tone(sc[k++%8]*(day>1?.94:1),.45,mg,'triangle',.3)},500);
setInterval(()=>{if(bg.gain.value>.02){const f=1800+Math.random()*1400;tone(f,.12,bg,'sine',.25,f+500)}},700);}
function mix(){if(!A)return;const L=[[.5,.12,0],[0,.09,.03],[0,0,.2],[0,0,.03]][day-1];[bg,mg,wg].forEach((g,i)=>g.gain.setTargetAtTime(L[i],A.currentTime,.5))}
const sfx=k=>{if(!A)return;if(k=='c')tone(660,.08,sg,'square',.05);if(k=='$'){tone(880,.1,sg,'square',.06);setTimeout(()=>tone(1320,.15,sg,'square',.06),90)}if(k=='t')tone(90,.25,sg,'sine',.5);if(k=='d')tone(70,1.4,sg,'sawtooth',.12,50);if(k=='v')for(let i=0;i<6;i++)setTimeout(()=>tone(150-i*8,.3,sg,'sawtooth',.1,130-i*8),i*220)};
/* manos y clientes */
const SK=['#f4c79a','#e6c6aa','#d2cfbf','#b2bbae','#97a39f','#82908d'];
function hand(x,y,r,s,m,st){const w=17-r*1.8,c=SK[r],hs=[30,38,40,32],pw=4*(w+3);let f='';
for(let i=0;i<4;i++){const fx=i*(w+3);f+=`<rect x="${fx}" y="${-hs[i]}" width="${w}" height="${hs[i]+8}" rx="${w/2}" fill="${c}"/><rect x="${fx+1}" y="${-hs[i]}" width="${w-2}" height="9" rx="3" fill="${r?'#16141a':'#e9a98a'}"/>`}
return `<g transform="translate(${x} ${y}) scale(${m?-s:s} ${s})" opacity="${r>4?.65:1}"><rect x="-6" y="34" width="${pw+6}" height="70" rx="6" fill="#1e1a22"/>${f}<rect x="-4" y="-4" width="${pw+4}" height="44" rx="16" fill="${c}"/><path d="M-4 22Q${pw/2} 34 ${pw} 22V24Q${pw} 40 ${pw-12} 40H8Q-4 40-4 24Z" fill="#000" fill-opacity=".14" stroke="none"/><ellipse cx="-6" cy="14" rx="7" ry="13" fill="${c}" transform="rotate(-25 -6 14)"/>${st?`<circle cx="${pw/2}" cy="18" r="9" fill="${st}" stroke="none"/>`:''}${r>1?`<path d="M6 6l8 10M${pw-8} 8l-6 12" stroke="#5a4a6a" stroke-width="2" fill="none"/>`:''}</g>`}
const torso=c=>`<path d="M240 432Q240 250 400 230Q560 250 560 432Z" fill="${c}"/><path d="M270 432Q270 290 330 262" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="8"/>`;
async function show(k){const w=$('who'),h=$('hands');w.style.opacity=h.style.opacity=0;await sleep(300);
w.innerHTML=torso(k=='g'?'#4a3f6b':'#18171c');const r=k=='g'?0:Math.min(5,Math.max(rot,day-1));
h.innerHTML=hand(300,396,r,1,0,k=='h'?col:0)+hand(500,396,r,1,1,k=='h'?col:0);h.className.baseVal='';
void w.getBoundingClientRect();w.style.opacity=h.style.opacity=1;sfx('t');await sleep(700)}
async function hideC(){$('who').style.opacity=$('hands').style.opacity=0;await sleep(800)}
/* UI */
function say(t,b=['Seguir'],w){return new Promise(r=>{ui.innerHTML=`<p class="cap">${w?`<b>${w}:</b> `:''}${t}</p><div class="row">${b.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div>`;ui.onclick=e=>{if(e.target.tagName=='BUTTON'){ui.onclick=null;sfx('c');r(+e.target.dataset.i)}}})}
const hud=p=>{$('dl').textContent=`Día ${day} · ${p}`;$('co').textContent=`🪙 ${coins} · cuota ${CUOTA}`};
function brew(full,hid,hint){return new Promise(res=>{ui.onclick=null;let pick=[];
ui.innerHTML=`<p class="cap">${hint}</p><div class="rec">${full.map((n,i)=>hid&&i==2?`<span class="ch sm">${n[0]}…?</span>`:`<span class="ch">${emo(n)} ${n}</span>`).join('')}</div><div class="shelf">${ING.map((g,i)=>`<button class="ing" data-i="${i}">${g[1]}<small>${g[0]}</small></button>`).join('')}</div><p class="cap" id="sl">Caldero: vacío</p><div class="row"><button id="mx" disabled>Mezclar</button></div>`;
const sl=$('sl'),mx=$('mx'),bs=[...ui.querySelectorAll('.ing')];
bs.forEach(b=>b.onclick=()=>{sfx('c');const i=+b.dataset.i,k=pick.indexOf(i);if(k>=0){pick.splice(k,1);b.classList.remove('on')}else if(pick.length<3){pick.push(i);b.classList.add('on')}
sl.textContent='Caldero: '+(pick.map(i=>ING[i][1]).join(' ')||'vacío');mx.disabled=pick.length<3});
mx.onclick=()=>{bs.forEach(b=>b.disabled=true);ui.querySelector('.row').innerHTML='<div class="bar"><i class="zn"></i><i class="mk"></i></div><button id="st">¡Ahora!</button>';
const z=12+Math.random()*52,zn=ui.querySelector('.zn'),mk=ui.querySelector('.mk');zn.style.left=z+'%';zn.style.width='24%';let t=0;
const iv=setInterval(()=>{t+=.035+day*.012;mk.style.left=(50+47*Math.sin(t))+'%'},16);
$('st').onclick=async()=>{clearInterval(iv);const p=parseFloat(mk.style.left),ok=p>=z&&p<=z+24,m=[...pick.map(i=>ING[i][0])].sort().join()==[...full].sort().join();
const cs=pick.map(i=>ING[i][2]),rgb=[1,3,5].map(k=>Math.round(cs.reduce((a,c)=>a+parseInt(c.slice(k,k+2),16),0)/3)),c=`rgb(${rgb})`;
sfx('$');sl.innerHTML=`<span class="po" style="background:${c}"></span>La poción burbujea.`;ui.querySelector('.row').innerHTML='';await sleep(1200);res({good:ok&&m,col:c})}}})}
/* juego */
async function client(k,E){
const [line,full]=E[k=='g'?'g':'h'];hud(k=='g'?'Cliente':'Las manos');
await show(k);
if(k=='h'&&day==4)await say('Las manos casi no se ven.');
const ch=await say(`“${line}”`,['Aceptar pedido','Rechazar'],k=='g'?'Sombra':'Manos');
const hid=k=='h';let gain=0;
if(ch==0){const r=await brew(full,hid,day==1&&k=='g'?'Tutorial: buscá en el estante los 3 ingredientes de la receta, ponelos en el caldero y frená la barra en la zona verde.':hid?'El último ingrediente está manchado. Completá la receta.':'Receta completa. Buscá los ingredientes.');
gain=PAGA[k][r.good?0:1];coins+=gain;if(k=='h'){col=r.col;rot=Math.min(5,rot+1+(r.good?0:1))}hud('Entrega')}
if(k=='g'){await say(ch==0?`“Gracias.” +${gain} 🪙`:'La sombra se va sin decir nada.')}
else{if(ch==0)await say(E.a+` +${gain} 🪙`);else await say(E.r);
if(day==3&&ch==0){$('hands').classList.add('trem');await sleep(1200);$('hands').classList.remove('trem')}
if(day==3&&ch==1){sv.classList.add('knock');sfx('t');await sleep(500);sv.classList.remove('knock')}
if(day==4)await sleep(800)}
await hideC()}
async function dayLoop(){const E=D[day-1];
sv.classList.remove('nt');sv.className.baseVal='d'+day;sv.style.transition='';mix();hud('Mañana');
$('dem').style.opacity=0;$('shut').style.transform='translateY(174px)';await sleep(300);$('shut').style.transform='translateY(0)';sfx('t');await sleep(1800);
await say(E.m,['Atender']);
await client('g',E);await client('h',E);
hud('Noche');sv.classList.add('nt');const dm=$('dm'),k=[.6,.8,1,1.35][day-1],x=[600,540,470,400][day-1];dm.setAttribute('transform',`translate(${x} 330) scale(${k})`);
await sleep(1200);$('dem').style.opacity=1;sfx('d');await sleep(1200);
await say(`“${E.d}”`,['Seguir'],'Demonio');
if(day==4)return true;
if(coins<CUOTA){await say('“No alcanza.”',['Seguir'],'Demonio');return false}
coins-=CUOTA;hud('Noche');await say(`El demonio cobra ${CUOTA} 🪙.`);return true}
async function fadeTxt(h,ms){const f=$('fade');f.innerHTML=h;f.style.opacity=1;f.style.pointerEvents='auto';await sleep(ms)}
async function ending(){ui.innerHTML='';hud('Final');$('dem').style.opacity=0;
await say('El demonio no cobra nada.');ui.innerHTML='';
const r=Math.min(5,Math.max(rot,3)),sil='<g fill="#07060b" stroke="#2b2733" stroke-width="3"><path d="M326 474Q326 340 400 322Q474 340 474 474Z"/><circle cx="400" cy="296" r="30"/><path d="M356 276L400 186L444 276Z"/><ellipse cx="400" cy="276" rx="62" ry="11"/></g>';
$('mir').innerHTML=$('shop').innerHTML.replace(/ id="/g,' data-i="')+`<g class="idle">${sil}</g>`;
$('shut').style.transform='translateY(0)';await sleep(100);$('shut').style.transform='translateY(-200px)';sfx('t');await sleep(1500);
$('out').style.opacity=0;$('mir').style.opacity=1;await sleep(4500);
$('own').style.opacity=1;$('own').innerHTML+=hand(300,640,r,1.6,0,col)+hand(500,640,r,1.6,1,col);
$('cam').style.transform='translateY(-190px)';await sleep(5000);
sfx('v');await say('Tu propia voz, con el tono de las manos: “Algo para que pase.”',['…']);
await fadeTxt('Del otro lado<br><button id="rs" style="margin-top:18px">Jugar de nuevo</button>',200);$('rs').onclick=()=>location.reload()}
async function play(){coins=0;rot=0;col=null;
for(day=1;day<=4;day++){if(!await dayLoop()){const f=$('fade');await fadeTxt('El bosque se cierra.',2800);f.style.opacity=0;f.style.pointerEvents='none';await sleep(1500);return play()}}
day=4;await ending()}
(function(){let v=7;const q=n=>{v=(v*9301+49297)%233280;return v/233280*n};let t='',d='',b='';
for(let i=0;i<70;i++){const x=125+q(550),y=300+q(120);t+=`<path d="M${x} ${y}l4-12 4 12M${x+7} ${y}l5-9 3 9" fill="none" class="gt" stroke-width="3"/>`}
for(let i=0;i<40;i++)d+=`<circle cx="${125+q(550)}" cy="${372+q(55)}" r="${1+q(2)}" fill="#000" fill-opacity=".25" stroke="none"/>`;
[[170,40],[330,34],[520,44],[640,30]].forEach(([x,w])=>{b+=`<path d="M${x+6} 96V300M${x+w*.5} 110V310M${x+w-8} 100V296" stroke="#000" stroke-opacity=".3" stroke-width="3" fill="none"/><path d="M${x+3} 92V300" stroke="#fff" stroke-opacity=".18" stroke-width="5" fill="none"/>`});
$('dirt').insertAdjacentHTML('beforebegin',t);$('dirt').insertAdjacentHTML('afterend',d);$('trk').insertAdjacentHTML('afterend',b)})();
(async()=>{hud('Intro');await say('Atendés por una ventanilla a medio abrir. Nunca ves quién pide, solo las manos. Todas las noches, alguien cobra 8 monedas.',['Abrir la tienda']);audio();play()})();
